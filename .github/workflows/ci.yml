name: CI

on:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - ".github/workflows/**"
      - "diagram.json"
      - "wokwi.toml"
      - "scenario.yaml"
  pull_request:
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - ".github/workflows/**"
      - "diagram.json"
      - "wokwi.toml"
      - "scenario.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run cppcheck
        run: |
          sudo apt-get install -y cppcheck
          cppcheck \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --enable=warning,performance,portability \
            --inline-suppr \
            main/ components/

  build-and-simulate:
    name: Build and simulate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate credentials.h
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASS: ${{ secrets.WIFI_PASS }}
        run: |
          python3 -c "
          import pathlib, os
          tpl = pathlib.Path('main/credentials.h.example').read_text()
          ssid   = os.environ.get('WIFI_SSID') or 'your_network_name'
          passwd = os.environ.get('WIFI_PASS') or 'your_password'
          pathlib.Path('main/credentials.h').write_text(
              tpl.replace('your_network_name', ssid).replace('your_password', passwd))
          "

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-v5.3.2-${{ runner.os }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fresnel-beacon.bin
            build/fresnel-beacon.elf

      - name: Install wokwi-cli
        if: ${{ secrets.WOKWI_CLI_TOKEN != '' }}
        run: |
          curl -Lo wokwi-cli https://github.com/wokwi/wokwi-cli/releases/download/v0.26.1/wokwi-cli-linuxstatic-x64
          chmod +x wokwi-cli
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Wokwi simulation
        if: ${{ secrets.WOKWI_CLI_TOKEN != '' }}
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          wokwi-cli --timeout 30000 \
            --scenario scenario.yaml \
            --serial-log-file wokwi-serial.log \
            .

      - name: Upload serial log
        if: ${{ always() && secrets.WOKWI_CLI_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-serial-log
          path: wokwi-serial.log
