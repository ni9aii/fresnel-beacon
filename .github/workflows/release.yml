name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build and run tests
        run: |
          gcc -Icomponents/led_driver/include -Icomponents/beacon_animation/include -I. test/test_beacon_math.c -lm -o test_beacon_math && ./test_beacon_math
          gcc -Icomponents/led_driver/include -Icomponents/renderer/include -I. test/test_led_driver.c components/renderer/renderer.c -lm -o test_led_driver && ./test_led_driver

  analyze:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run cppcheck
        run: |
          sudo apt-get install -y cppcheck
          cppcheck \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --enable=warning,performance,portability \
            --inline-suppr \
            main/ components/

  release:
    name: Build and release
    needs: [test, analyze]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Generate credentials.h
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASS: ${{ secrets.WIFI_PASS }}
        run: |
          python3 -c "
          import pathlib, os
          tpl = pathlib.Path('main/credentials.h.example').read_text()
          ssid   = os.environ.get('WIFI_SSID')
          passwd = os.environ.get('WIFI_PASS')
          if ssid and passwd:
              for val, name in [(ssid, 'SSID'), (passwd, 'PASS')]:
                  if not val.strip():
                      raise ValueError(f'{name} must not be empty')
                  if any(c in val for c in '\"\\\n\r'):
                      raise ValueError(f'{name} contains invalid C-string characters')
              pathlib.Path('main/credentials.h').write_text(
                  tpl.replace('your_network_name', ssid).replace('your_password', passwd))
              print('Using configured WiFi credentials')
          else:
              # Fallback: build with example template so firmware starts in AP mode
              pathlib.Path('main/credentials.h').write_text(tpl)
              print('WIFI_SSID / WIFI_PASS secrets not set; firmware will start in AP mode for provisioning')
          "

      - name: Cache ESP-IDF tools
        uses: actions/cache@v5.0.5
        with:
          path: ~/.espressif
          key: esp-idf-v5.3.2-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'sdkconfig.defaults') }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: idf.py build

      - name: Firmware size report
        run: ls -lh build/*.bin build/*.elf 2>/dev/null || true

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "fresnel-beacon ${{ github.ref_name }}" \
            --notes "ESP32-S3 firmware for WS2812B 8×8 matrix lighthouse lamp.
          Flash with: esptool.py write_flash 0x0 fresnel-beacon.bin" \
            build/fresnel-beacon.bin \
            build/fresnel-beacon.elf
        env:
          GH_TOKEN: ${{ github.token }}
