name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - ".github/workflows/**"
      - "diagram.json"
      - "wokwi.toml"
      - "scenario.yaml"
      - "test/**"
  pull_request:
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - ".github/workflows/**"
      - "diagram.json"
      - "wokwi.toml"
      - "scenario.yaml"
      - "test/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Build and run tests
        run: |
          gcc -Icomponents/led_driver/include -Icomponents/beacon_animation/include -I. test/test_beacon_math.c -lm -o test_beacon_math && ./test_beacon_math
          gcc -Icomponents/led_driver/include -Icomponents/renderer/include -I. test/test_led_driver.c components/renderer/renderer.c -lm -o test_led_driver && ./test_led_driver

      - name: Check formatting
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
          find components main test -name "*.c" -o -name "*.h" | xargs clang-format-18 --dry-run --Werror

  analyze:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Run cppcheck
        run: |
          sudo apt-get install -y cppcheck
          cppcheck \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --enable=warning,performance,portability \
            --inline-suppr \
            main/ components/

      - name: Run semgrep security scan
        run: |
          pip install semgrep
          semgrep --config=auto \
            --severity=ERROR \
            --error \
            main/ components/ test/

  clang-tidy:
    name: clang-tidy static analysis
    runs-on: ubuntu-24.04
    if: always()  # Run even if test/analyze fails
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy-18

      - name: Run clang-tidy (non-blocking)
        run: |
          # Find all C files in components and main
          find components main -name "*.c" -type f | while read file; do
            echo "Checking $file..."
            clang-tidy-18 "$file" --config-file=.clang-tidy 2>&1 | tee -a clang-tidy.log
          done

          # Check if any errors were found
          if grep -q "error:" clang-tidy.log 2>/dev/null; then
            echo "::warning::clang-tidy found errors (see output above)"
            # Don't fail the job, just warn
            exit 0
          else
            echo "No clang-tidy errors found"
          fi
        continue-on-error: true  # Non-blocking: don't fail CI

  build-and-simulate:
    name: Build and simulate
    needs: [test, analyze]
    runs-on: ubuntu-24.04
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Display scenario file
        run: cat scenario.yaml

      - name: Generate credentials.h (dummy values for CI)
        run: |
          python3 -c "
          import pathlib
          tpl = pathlib.Path('main/credentials.h.example').read_text()
          pathlib.Path('main/credentials.h').write_text(
              tpl.replace('your_network_name', 'ci_test_network')
                   .replace('your_password', 'ci_test_password'))
          "

      - name: Cache ESP-IDF tools
        uses: actions/cache@v5.0.5
        with:
          path: ~/.espressif
          key: esp-idf-v5.3.2-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'sdkconfig.defaults') }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: idf.py build -DWOKWI_SIMULATION=1

      - name: Firmware size report
        run: ls -lh build/*.bin build/*.elf 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 7
          name: firmware
          path: |
            build/fresnel-beacon.bin
            build/fresnel-beacon.elf

      - name: Wokwi token not set
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "::warning::WOKWI_CLI_TOKEN not set, simulation skipped"

      - name: Install wokwi-cli
        if: env.WOKWI_CLI_TOKEN != ''
        env:
          WOKWI_CLI_SHA256: 72d968150babaf7532c47ab7741eb85a95a6c3e3cfef91ffbcfdb677fd38e811
        run: |
          curl -Lo wokwi-cli https://github.com/wokwi/wokwi-cli/releases/download/v0.26.1/wokwi-cli-linuxstatic-x64
          echo "$WOKWI_CLI_SHA256  wokwi-cli" | sha256sum -c
          chmod +x wokwi-cli
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Wokwi simulation
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          wokwi-cli --timeout 120000 \
            --scenario scenario.yaml \
            --serial-log-file wokwi-serial.log \
            .

      - name: Upload serial log
        if: always() && env.WOKWI_CLI_TOKEN != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 7
          name: wokwi-serial-log
          path: wokwi-serial.log
